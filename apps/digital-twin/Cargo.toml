[package]
name = "shorborno-digital-twin"
version = "0.2.0"
edition = "2021"
description = "Predictive Memory Security Assessment (PMSA) Digital Twin Engine for ShorbornoAI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
