events { worker_connections 1024; }
http {
  upstream digital_twin { server digital-twin:8090; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    location /health { proxy_pass http://digital_twin/health; }
    location /twin/  { proxy_pass http://digital_twin/twin/; }
  }
}
