# AIS-PMSA Telegraf -> InfluxDB -> Grafana Telemetry Pipeline Reference
[[inputs.http_listener_v2]]
  service_address = "127.0.0.1:18420"
  path = "/telegraf"
  methods = ["POST"]
  data_format = "json"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  organization = "shorbornoai-lab"
  bucket = "pmsa_telemetry"
